# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "1.0.0"
  python_check_max: "3.14"
  cov_fail_under: "100"

package:
  name: pylsqpack
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pylsqpack/pylsqpack-${{ version }}.tar.gz
  sha256: 4674adc2c833c1c70a36454f5774e9def94fc3109e4a8464d804af2a2030957a

build:
  number: 0
  skip: is_abi3 and not is_python_min
  python:
    version_independent: ${{ is_abi3 }}
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies

requirements:
  build:
    - ${{ compiler("c") }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
  host:
    - pip
    - setuptools
    - if: is_abi3
      then:
        - python ${{ python_min }}.*
        - python-abi3
      else:
        - python
  run:
    - if: is_abi3
      then:
        - python >=${{ python_min }}
        - python-abi3
      else:
        - python

tests:
  - package_contents:
      strict: true
      files:
        - etc/conda/test-files/pylsqpack/**
      site_packages:
        - pylsqpack/**
        - pylsqpack-${{ version }}.dist-info/**
  - python:
      imports: pylsqpack._binding
      pip_check: true
      python_version:
        - if: is_abi3
          then:
            - ${{ python_min }}.*
            - ${{ python_check_max }}.*
          else:
            - "*"
  - files:
      source:
        - tests/
    requirements:
      run:
        - coverage
        - mypy
        - pytest
        - if: is_abi3
          then:
            - python ${{ python_min }}.*
            - abi3audit
    script:
      - coverage run --source=pylsqpack --branch -m pytest -vv --tb=long --color=yes
      - if: linux
        then: coverage report --show-missing --skip-covered --fail-under=${{ cov_fail_under }}
      - mypy -p pylsqpack
      - if: is_abi3
        then:
          - if: unix
            then: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} "${SP_DIR}/pylsqpack/_binding.abi3.so"
            else: abi3audit -s -v --assume-minimum-abi3 ${{ python_min }} "%SP_DIR%\pylsqpack\_binding.pyd"

about:
  summary: Python wrapper for the ls-qpack QPACK library
  license: MIT AND BSD-3-Clause
  license_file:
    - LICENSE
    - vendor/ls-qpack/LICENSE
  homepage: https://pypi.org/project/pylsqpack
  repository: https://github.com/aiortc/pylsqpack
  documentation: https://pylsqpack.readthedocs.io

extra:
  recipe-maintainers:
    - jonashaag
    - bollwyvl
